name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - README.md
      - LICENSE
  pull_request:
    paths-ignore:
      - README.md
      - LICENSE
  workflow_dispatch:
    inputs:
      include_beta:
        description: Run optional tests on an iOS 27+ pre-release Xcode/simulator when available
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-tests:
    name: Package Tests (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: iOS 18 latest
            runner: macos-15
            ios_major: '18'
            device_name: iPhone 16
          - name: iOS 26 latest
            runner: macos-26
            ios_major: '26'
            device_name: iPhone 17
    runs-on: ${{ matrix.runner }}
    env:
      DEVICE_NAME: ${{ matrix.device_name }}
      IOS_MAJOR: ${{ matrix.ios_major }}
      XCODE_MAJOR: '26'
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Create Swift package workspace
        run: |
          mkdir -p .swiftpm/xcode/package.xcworkspace
          cat > .swiftpm/xcode/package.xcworkspace/contents.xcworkspacedata <<'XML'
          <?xml version="1.0" encoding="UTF-8"?>
          <Workspace
             version = "1.0">
             <FileRef
                location = "self:">
             </FileRef>
          </Workspace>
          XML

      - name: Resolve latest stable Xcode
        run: |
          xcode_app="$(ruby <<'RUBY'
          xcode_major = ENV.fetch("XCODE_MAJOR")
          candidates = Dir["/Applications/Xcode_#{xcode_major}*.app"].select { |path| File.directory?(path) }

          def pre_release_xcode_path?(path)
            labels = [path, File.realpath(path)].map { |candidate| File.basename(candidate).downcase }
            labels.any? do |label|
              label.match?(/beta|release[ _-]?candidate|(?:^|[_. -])rc(?:$|[_. -])/)
            end
          end

          candidates = candidates.reject do |path|
            pre_release_xcode_path?(path)
          end

          def version_components(path)
            version = File.basename(path)[/Xcode_(\d+(?:\.\d+)*)/, 1]
            version.to_s.split(".").map(&:to_i)
          end

          selected = candidates.max_by { |path| version_components(path) }
          abort("No stable Xcode #{xcode_major} installation found") unless selected
          puts selected
          RUBY
          )"
          echo "DEVELOPER_DIR=${xcode_app}/Contents/Developer" >> "$GITHUB_ENV"
          echo "Resolved Xcode: ${xcode_app}"

      - name: Resolve latest iOS simulator
        run: |
          ruby <<'RUBY'
          require "json"

          ios_major = ENV.fetch("IOS_MAJOR")
          device_name = ENV.fetch("DEVICE_NAME")
          devices = JSON.parse(`xcrun simctl list devices available --json`).fetch("devices")
          matches = []

          devices.each do |runtime, runtime_devices|
            next unless runtime =~ /SimRuntime\.iOS-(\d+(?:-\d+)*)$/

            version = Regexp.last_match(1).tr("-", ".")
            next unless version.split(".").first == ios_major

            runtime_devices.each do |device|
              next unless device["name"] == device_name
              next unless device.fetch("isAvailable", true)

              matches << [version.split(".").map(&:to_i), version, device.fetch("udid")]
            end
          end

          if matches.empty?
            warn "No available #{device_name} simulator found for iOS #{ios_major}.x"
            system("xcrun simctl list devices available")
            exit 1
          end

          _, version, udid = matches.max_by { |components, _, _| components }
          File.open(ENV.fetch("GITHUB_ENV"), "a") do |env|
            env.puts "DESTINATION=platform=iOS Simulator,id=#{udid}"
            env.puts "RESOLVED_IOS_VERSION=#{version}"
          end
          puts "Resolved simulator: #{device_name} iOS #{version} (#{udid})"
          RUBY

      - name: Show Xcode and simulator environment
        run: |
          xcodebuild -version
          xcodebuild -showsdks
          echo "Destination: ${DESTINATION}"
          echo "Resolved iOS: ${RESOLVED_IOS_VERSION}"

      - name: Run package tests
        run: |
          xcodebuild test \
            -workspace .swiftpm/xcode/package.xcworkspace \
            -scheme UIHostingMenu \
            -destination "${DESTINATION}" \
            -enableCodeCoverage NO \
            -parallel-testing-enabled NO \
            -maximum-concurrent-test-simulator-destinations 1

  package-tests-beta:
    name: Package Tests (iOS 27+ beta if available)
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.include_beta }}
    runs-on: macos-26
    continue-on-error: true
    env:
      MIN_IOS_MAJOR: '27'
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Create Swift package workspace
        run: |
          mkdir -p .swiftpm/xcode/package.xcworkspace
          cat > .swiftpm/xcode/package.xcworkspace/contents.xcworkspacedata <<'XML'
          <?xml version="1.0" encoding="UTF-8"?>
          <Workspace
             version = "1.0">
             <FileRef
                location = "self:">
             </FileRef>
          </Workspace>
          XML

      - name: Resolve latest pre-release Xcode
        id: beta-xcode
        run: |
          ruby <<'RUBY'
          candidates = Dir["/Applications/Xcode_*.app"].select { |path| File.directory?(path) }

          def pre_release_xcode_path?(path)
            labels = [path, File.realpath(path)].map { |candidate| File.basename(candidate).downcase }
            labels.any? do |label|
              label.match?(/beta|release[ _-]?candidate|(?:^|[_. -])rc(?:$|[_. -])/)
            end
          end

          def version_components(path)
            version = File.basename(path)[/Xcode_(\d+(?:\.\d+)*)/, 1]
            version.to_s.split(".").map(&:to_i)
          end

          min_ios_major = ENV.fetch("MIN_IOS_MAJOR").to_i
          selected = candidates.select { |path| pre_release_xcode_path?(path) }
                               .select { |path| version_components(path).first.to_i >= min_ios_major }
                               .max_by { |path| version_components(path) }
          File.open(ENV.fetch("GITHUB_OUTPUT"), "a") do |output|
            output.puts "available=#{!selected.nil?}"
          end

          unless selected
            puts "No pre-release Xcode #{min_ios_major}+ installation found; skipping beta package tests."
            exit 0
          end

          File.open(ENV.fetch("GITHUB_ENV"), "a") do |env|
            env.puts "DEVELOPER_DIR=#{selected}/Contents/Developer"
          end
          puts "Resolved pre-release Xcode: #{selected}"
          RUBY

      - name: Resolve latest eligible beta iOS simulator
        id: beta-simulator
        if: ${{ steps.beta-xcode.outputs.available == 'true' }}
        run: |
          ruby <<'RUBY'
          require "open3"

          min_ios_major = ENV.fetch("MIN_IOS_MAJOR").to_i
          preferred_devices = [
            "iPhone 17",
            "iPhone 17 Pro",
            "iPhone 17 Pro Max",
            "iPhone 16",
            "iPhone 15"
          ]

          command = [
            "xcodebuild",
            "-showdestinations",
            "-workspace", ".swiftpm/xcode/package.xcworkspace",
            "-scheme", "UIHostingMenu"
          ]
          output, status = Open3.capture2e(*command)
          unless status.success?
            File.open(ENV.fetch("GITHUB_OUTPUT"), "a") { |out| out.puts "available=false" }
            puts "Could not list package destinations for pre-release Xcode; skipping beta package tests."
            puts output
            exit 0
          end

          in_available_destinations = false
          matches = []

          output.each_line do |line|
            if line.include?("Available destinations")
              in_available_destinations = true
              next
            end
            if line.include?("Ineligible destinations")
              in_available_destinations = false
              next
            end
            next unless in_available_destinations
            next unless line.include?("{ platform:iOS Simulator")

            fields = line.scan(/([A-Za-z]+):([^,}]+)/).to_h do |key, value|
              [key.strip, value.strip]
            end
            next unless fields["platform"] == "iOS Simulator"

            version = fields["OS"]
            udid = fields["id"]
            next unless version && udid

            components = version.split(".").map(&:to_i)
            next if components.first < min_ios_major

            device_name = fields["name"]
            next unless device_name

            preference = preferred_devices.index(device_name)
            next unless preference

            matches << [components, -preference, version, udid, device_name]
          end

          selected = matches.max_by { |components, preference, _, _, _| [components, preference] }
          File.open(ENV.fetch("GITHUB_OUTPUT"), "a") do |output|
            output.puts "available=#{!selected.nil?}"
          end

          unless selected
            puts "No eligible iOS #{min_ios_major}+ simulator destination found for pre-release Xcode; skipping beta package tests."
            puts output
            exit 0
          end

          _, _, version, udid, device_name = selected
          File.open(ENV.fetch("GITHUB_ENV"), "a") do |env|
            env.puts "DESTINATION=platform=iOS Simulator,id=#{udid}"
            env.puts "RESOLVED_IOS_VERSION=#{version}"
            env.puts "RESOLVED_DEVICE_NAME=#{device_name}"
          end
          puts "Resolved beta simulator: #{device_name} iOS #{version} (#{udid})"
          RUBY

      - name: Show beta Xcode and simulator environment
        if: ${{ steps.beta-xcode.outputs.available == 'true' && steps.beta-simulator.outputs.available == 'true' }}
        run: |
          xcodebuild -version
          xcodebuild -showsdks
          echo "Destination: ${DESTINATION}"
          echo "Resolved device: ${RESOLVED_DEVICE_NAME}"
          echo "Resolved iOS: ${RESOLVED_IOS_VERSION}"

      - name: Run beta package tests
        if: ${{ steps.beta-xcode.outputs.available == 'true' && steps.beta-simulator.outputs.available == 'true' }}
        run: |
          xcodebuild test \
            -workspace .swiftpm/xcode/package.xcworkspace \
            -scheme UIHostingMenu \
            -destination "${DESTINATION}" \
            -enableCodeCoverage NO \
            -parallel-testing-enabled NO \
            -maximum-concurrent-test-simulator-destinations 1
